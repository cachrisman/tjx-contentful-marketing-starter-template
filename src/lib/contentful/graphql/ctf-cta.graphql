fragment CtaFields on ComponentCta {
  __typename
  sys {
    id
  }
  headline
  subline {
    json
  }
  ctaText
  targetPage {
    ...PageLinkFields
  }
  urlParameters
  ctaText2
  targetPage2 {
    ...PageLinkFields
  }
  urlParameters2
  ctaText3
  targetPage3 {
    ...PageLinkFields
  }
  urlParameters3
  ctaText4
  targetPage4 {
    ...PageLinkFields
  }
  urlParameters4
  colorPalette
}

query CtfCta($id: String!, $locale: String, $preview: Boolean) @contentSourceMaps {
  componentCta(id: $id, locale: $locale, preview: $preview) {
    ...CtaFields
  }
}
