fragment PersonFields on TopicPerson {
  __typename
  sys {
    id
  }
  name
  bio {
    json
  }
  avatar {
    ...AssetFields
  }
  website
  location
  cardStyle
}

query CtfPerson($id: String!, $locale: String, $preview: Boolean) @contentSourceMaps {
  topicPerson(id: $id, preview: $preview, locale: $locale) {
    ...PersonFields
  }
}
